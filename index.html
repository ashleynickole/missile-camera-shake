<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#080808" />
  <title>Missile Studios Live Viewfinder Slideshow</title>

  <style>
    :root {
      --frame: rgba(255,255,255,.92);
      --frame-muted: rgba(255,255,255,.52);
      --bg: #080808;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      margin: 0;
      background: var(--bg);
    }

    body {
      min-height: 220vh;
      font-family: Arial, Helvetica, sans-serif;
    }

    .camera-section {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100svh;
      min-height: 480px;
      overflow: hidden;
      background: #080808;
      perspective: 1400px;
      isolation: isolate;
      cursor: crosshair;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-y;
    }

    .image-stage {
      position: absolute;
      inset: -12%;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .camera-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      transform: scale(1.08);
      opacity: 0;
      z-index: 1;
      transition:
        opacity 360ms cubic-bezier(.22,1,.36,1),
        filter 240ms ease;
      filter:
        contrast(1.035)
        saturate(.97)
        brightness(.985)
        blur(0px);
      pointer-events: none;
      -webkit-user-drag: none;
    }

    .camera-image.active {
      opacity: 1;
      z-index: 3;
    }

    .camera-image.outgoing {
      opacity: 1;
      z-index: 2;
    }

    .camera-image.focus-pulse {
      animation: focusPulse 560ms cubic-bezier(.2,.8,.2,1);
    }

    @keyframes focusPulse {
      0% {
        filter:
          contrast(1.035)
          saturate(.97)
          brightness(.985)
          blur(0px);
      }
      30% {
        filter:
          contrast(1.01)
          saturate(.94)
          brightness(.99)
          blur(3.2px);
      }
      58% {
        filter:
          contrast(1.05)
          saturate(.98)
          brightness(1.01)
          blur(.7px);
      }
      100% {
        filter:
          contrast(1.035)
          saturate(.97)
          brightness(.985)
          blur(0px);
      }
    }

    .image-stage::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at center,
          transparent 38%,
          rgba(0,0,0,.07) 66%,
          rgba(0,0,0,.34) 100%
        ),
        linear-gradient(
          to bottom,
          rgba(0,0,0,.04),
          transparent 20%,
          transparent 80%,
          rgba(0,0,0,.11)
        );
    }

    .glass {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background:
        linear-gradient(
          118deg,
          rgba(255,255,255,.075) 0%,
          rgba(255,255,255,0) 29%,
          rgba(255,255,255,0) 72%,
          rgba(255,255,255,.035) 100%
        );
    }

    .viewfinder {
      position: absolute;
      inset: clamp(18px, 3vw, 50px);
      z-index: 5;
      pointer-events: none;
    }

    .corner {
      position: absolute;
      width: clamp(38px, 5vw, 78px);
      height: clamp(38px, 5vw, 78px);
    }

    .corner::before,
    .corner::after {
      content: "";
      position: absolute;
      background: var(--focus-color, var(--frame));
      border-radius: 999px;
      box-shadow: 0 0 8px rgba(0,0,0,.22);
    }

    .corner::before {
      width: 100%;
      height: 2px;
    }

    .corner::after {
      width: 2px;
      height: 100%;
    }

    .tl { top: 0; left: 0; }
    .tl::before, .tl::after { top: 0; left: 0; }

    .tr { top: 0; right: 0; }
    .tr::before { top: 0; right: 0; }
    .tr::after { top: 0; right: 0; }

    .bl { bottom: 0; left: 0; }
    .bl::before { bottom: 0; left: 0; }
    .bl::after { bottom: 0; left: 0; }

    .br { bottom: 0; right: 0; }
    .br::before { bottom: 0; right: 0; }
    .br::after { bottom: 0; right: 0; }

    .focus-box {
      position: absolute;
      left: 50%;
      top: 50%;
      width: clamp(76px, 9vw, 132px);
      aspect-ratio: 1.4;
      transform: translate(-50%, -50%);
      opacity: .74;
      transition:
        left 180ms cubic-bezier(.22,1,.36,1),
        top 180ms cubic-bezier(.22,1,.36,1),
        opacity 160ms ease,
        filter 160ms ease;
    }

    .focus-corner {
      position: absolute;
      width: 20%;
      height: 27%;
    }

    .focus-corner::before,
    .focus-corner::after {
      content: "";
      position: absolute;
      background: var(--focus-color, var(--frame));
      border-radius: 999px;
      box-shadow: 0 0 8px color-mix(in srgb, var(--focus-color, white) 55%, transparent);
      transition: background 120ms ease, box-shadow 120ms ease;
    }

    .focus-corner::before {
      width: 100%;
      height: 1.5px;
    }

    .focus-corner::after {
      width: 1.5px;
      height: 100%;
    }

    .focus-corner.tl::before,
    .focus-corner.tl::after { top: 0; left: 0; }

    .focus-corner.tr::before { top: 0; right: 0; }
    .focus-corner.tr::after { top: 0; right: 0; }

    .focus-corner.bl::before { bottom: 0; left: 0; }
    .focus-corner.bl::after { bottom: 0; left: 0; }

    .focus-corner.br::before { bottom: 0; right: 0; }
    .focus-corner.br::after { bottom: 0; right: 0; }

    .center-dot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--focus-color, var(--frame));
      transform: translate(-50%, -50%);
      box-shadow: 0 0 8px color-mix(in srgb, var(--focus-color, white) 55%, transparent);
      transition: background 120ms ease, box-shadow 120ms ease;
    }

    .safe-line {
      position: absolute;
      left: 50%;
      width: 42px;
      height: 1px;
      transform: translateX(-50%);
      background: var(--frame-muted);
    }

    .safe-line.top { top: 0; }
    .safe-line.bottom { bottom: 0; }

    .side-mark {
      position: absolute;
      top: 50%;
      width: 1px;
      height: 38px;
      transform: translateY(-50%);
      background: var(--frame-muted);
    }

    .side-mark.left { left: 0; }
    .side-mark.right { right: 0; }

    .grain {
      position: absolute;
      inset: -40%;
      z-index: 6;
      pointer-events: none;
      opacity: .045;
      background-image:
        repeating-radial-gradient(
          circle at 18% 31%,
          rgba(255,255,255,.7) 0 .45px,
          rgba(0,0,0,.6) .7px 1px,
          transparent 1.2px 4px
        );
      background-size: 6px 6px;
      animation: grain .24s steps(2) infinite;
      mix-blend-mode: overlay;
    }

    @keyframes grain {
      0% { transform: translate3d(-2%,1%,0); }
      25% { transform: translate3d(1%,-2%,0); }
      50% { transform: translate3d(2%,2%,0); }
      75% { transform: translate3d(-1%,-1%,0); }
      100% { transform: translate3d(1%,1%,0); }
    }

    .scroll-space {
      height: 120vh;
      background: #080808;
    }


    .shutter-flash {
      position: absolute;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      background: rgba(255,255,255,.98);
      opacity: 0;
    }

    .shutter-flash.fire {
      animation: shutterFlash 260ms ease-out;
    }

    @keyframes shutterFlash {
      0% { opacity: 0; }
      10% { opacity: .88; }
      22% { opacity: .34; }
      100% { opacity: 0; }
    }

    .camera-section.shutter-kick .image-stage {
      animation: shutterKick 250ms cubic-bezier(.2,.8,.2,1);
    }

    @keyframes shutterKick {
      0% { filter: brightness(1); }
      12% { filter: brightness(1.12); }
      36% { filter: brightness(.97); }
      100% { filter: brightness(1); }
    }

    .camera-section.capture-zoom .image-stage {
      animation: captureZoom 640ms cubic-bezier(.18,.82,.22,1);
    }

    @keyframes captureZoom {
      0% { scale: 1; }
      22% { scale: 1.075; }
      48% { scale: 1.025; }
      72% { scale: 1.055; }
      100% { scale: 1; }
    }

    .camera-section.photo-swap .image-stage {
      animation: photoSwapMotion 420ms cubic-bezier(.2,.75,.2,1);
    }

    @keyframes photoSwapMotion {
      0% { translate: 0 0; rotate: 0deg; }
      28% { translate: -18px 7px; rotate: -.55deg; }
      58% { translate: 13px -5px; rotate: .38deg; }
      100% { translate: 0 0; rotate: 0deg; }
    }


    .focus-box.searching {
      --focus-color: #ffd43b;
      opacity: 1;
      animation: focusSearch 360ms ease-in-out;
    }

    .focus-box.locked {
      --focus-color: #39ff6a;
      opacity: 1;
      animation: focusLock 360ms cubic-bezier(.2,.8,.2,1);
      filter: drop-shadow(0 0 8px rgba(57,255,106,.38));
    }

    @keyframes focusSearch {
      0% { transform: translate(-50%, -50%) scale(1.12); opacity: .35; }
      35% { transform: translate(-50%, -50%) scale(.92); opacity: 1; }
      70% { transform: translate(-50%, -50%) scale(1.04); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes focusLock {
      0% { transform: translate(-50%, -50%) scale(.90); }
      45% { transform: translate(-50%, -50%) scale(1.10); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }

    .shutter-flash.user-fire {
      animation: userFlash 340ms ease-out;
    }

    @keyframes userFlash {
      0% { opacity: 0; }
      8% { opacity: 1; }
      18% { opacity: .72; }
      34% { opacity: .22; }
      100% { opacity: 0; }
    }

    .camera-section.user-trigger .image-stage {
      animation: userTriggerShake 360ms cubic-bezier(.18,.82,.2,1);
    }

    @keyframes userTriggerShake {
      0%   { translate: 0 0; rotate: 0deg; scale: 1; }
      12%  { translate: -5px 4px; rotate: -.34deg; scale: 1.012; }
      26%  { translate: 7px -5px; rotate: .42deg; scale: 1.025; }
      44%  { translate: -4px 3px; rotate: -.24deg; scale: 1.015; }
      68%  { translate: 2px -1px; rotate: .10deg; scale: 1.006; }
      100% { translate: 0 0; rotate: 0deg; scale: 1; }
    }

    @media (max-width: 700px) {
      body {
        min-height: 185vh;
      }

      .camera-section {
        min-height: 420px;
      }

      .viewfinder {
        inset: 15px;
      }

      .image-stage {
        inset: -16%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body {
        min-height: 100vh;
      }

      .camera-section {
        position: relative;
      }

      .image-stage {
        transform: none !important;
      }

      .grain {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <section class="camera-section" id="cameraSection">
    <div class="image-stage" id="imageStage">
      <img
        class="camera-image active"
        src="https://static.wixstatic.com/media/566b6b_83e7b2d53f6a47f1999d518594826438~mv2.jpg"
        alt="Missile Studios client portrait one"
        draggable="false"
        decoding="async"
        loading="eager"
      />
      <img
        class="camera-image"
        src="https://static.wixstatic.com/media/566b6b_49f246107046486e80eba06518aba4bd~mv2.png"
        alt="Missile Studios client portrait two"
        draggable="false"
        decoding="async"
        loading="eager"
      />
      <img
        class="camera-image"
        src="https://static.wixstatic.com/media/566b6b_2b2a14b7ccf546bfae5b7f922ad07433~mv2.jpg"
        alt="Missile Studios client portrait three"
        draggable="false"
        decoding="async"
        loading="eager"
      />
      <img
        class="camera-image"
        src="https://static.wixstatic.com/media/566b6b_03552c2680ff4944aeea31f9e3b3a21d~mv2.jpg"
        alt="Missile Studios client portrait four"
        draggable="false"
        decoding="async"
        loading="eager"
      />
      <img
        class="camera-image"
        src="https://static.wixstatic.com/media/566b6b_905f73eb0b704f40bd8a210a8b627946~mv2.jpg"
        alt="Missile Studios client portrait five"
        draggable="false"
        decoding="async"
        loading="eager"
      />
    </div>

    <div class="glass"></div>

    <div class="viewfinder" aria-hidden="true">
      <span class="corner tl"></span>
      <span class="corner tr"></span>
      <span class="corner bl"></span>
      <span class="corner br"></span>

      <span class="safe-line top"></span>
      <span class="safe-line bottom"></span>
      <span class="side-mark left"></span>
      <span class="side-mark right"></span>

      <div class="focus-box" id="focusBox">
        <span class="focus-corner tl"></span>
        <span class="focus-corner tr"></span>
        <span class="focus-corner bl"></span>
        <span class="focus-corner br"></span>
        <span class="center-dot"></span>
      </div>
    </div>

    <div class="grain"></div>
    <div class="shutter-flash" id="shutterFlash"></div>
  </section>

  <div class="scroll-space" aria-hidden="true"></div>

  <script>
    (() => {
      const imageStage = document.getElementById("imageStage");
      const cameraSection = document.getElementById("cameraSection");
      const shutterFlash = document.getElementById("shutterFlash");
      const focusBox = document.getElementById("focusBox");
      const viewfinder = document.querySelector(".viewfinder");
      const images = [...document.querySelectorAll(".camera-image")];

      let activeImageIndex = 0;
      let imageCycleTimer = null;

      let pointerTargetX = 0;
      let pointerTargetY = 0;
      let pointerX = 0;
      let pointerY = 0;

      let scrollTarget = 0;
      let scrollProgress = 0;

      let currentX = 0;
      let currentY = 0;
      let currentScale = 1.1;
      let currentRotate = 0;

      let lastTime = performance.now();
      let elapsed = 0;

      const reducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches;

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function updateScrollProgress() {
        const maxScroll =
          document.documentElement.scrollHeight -
          window.innerHeight;

        scrollTarget = maxScroll > 0
          ? clamp(window.scrollY / maxScroll, 0, 1)
          : 0;
      }

      function updatePointer(clientX, clientY) {
        const rect = cameraSection.getBoundingClientRect();

        pointerTargetX = clamp(
          ((clientX - rect.left) / rect.width - .5) * 2,
          -1,
          1
        );

        pointerTargetY = clamp(
          ((clientY - rect.top) / rect.height - .5) * 2,
          -1,
          1
        );
      }

      window.addEventListener("scroll", updateScrollProgress, {
        passive: true
      });

      window.addEventListener("resize", updateScrollProgress);

      cameraSection.addEventListener("pointermove", event => {
        updatePointer(event.clientX, event.clientY);
      });

      cameraSection.addEventListener("pointerleave", () => {
        pointerTargetX = 0;
        pointerTargetY = 0;
      });

      cameraSection.addEventListener("touchmove", event => {
        const touch = event.touches[0];

        if (touch) {
          updatePointer(touch.clientX, touch.clientY);
        }
      }, { passive: true });

      cameraSection.addEventListener("touchend", () => {
        pointerTargetX = 0;
        pointerTargetY = 0;
      }, { passive: true });


      const imageReady = images.map(image => {
        if (image.complete && image.naturalWidth > 0) {
          return Promise.resolve();
        }

        return new Promise(resolve => {
          image.addEventListener("load", resolve, { once: true });
          image.addEventListener("error", resolve, { once: true });
        });
      });

      function restartClass(element, className) {
        element.classList.remove(className);
        void element.offsetWidth;
        element.classList.add(className);
      }

      function fireShutter() {
        restartClass(shutterFlash, "fire");
        restartClass(cameraSection, "shutter-kick");

        window.setTimeout(() => {
          shutterFlash.classList.remove("fire");
          cameraSection.classList.remove("shutter-kick");
        }, 280);
      }

      function focusCurrentImage() {
        const current = images[activeImageIndex];
        restartClass(current, "focus-pulse");

        window.setTimeout(() => {
          current.classList.remove("focus-pulse");
        }, 600);
      }

      async function showNextImage() {
        const oldIndex = activeImageIndex;
        const nextIndex = (activeImageIndex + 1) % images.length;

        await imageReady[nextIndex];

        const outgoing = images[oldIndex];
        const incoming = images[nextIndex];

        incoming.classList.add("active");
        outgoing.classList.add("outgoing");

        restartClass(cameraSection, "photo-swap");

        // Incoming image becomes visible before outgoing image fades.
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            outgoing.classList.remove("active");
            outgoing.classList.remove("outgoing");
            activeImageIndex = nextIndex;
          });
        });

        window.setTimeout(() => {
          cameraSection.classList.remove("photo-swap");
        }, 460);
      }

      async function runImageCycle() {
        clearTimeout(imageCycleTimer);

        // Small autofocus adjustment before the first capture.
        imageCycleTimer = window.setTimeout(() => {
          focusCurrentImage();
          restartClass(cameraSection, "capture-zoom");

          // First shutter.
          imageCycleTimer = window.setTimeout(() => {
            fireShutter();

            // Refocus quickly between shots.
            imageCycleTimer = window.setTimeout(() => {
              focusCurrentImage();

              // Second shutter.
              imageCycleTimer = window.setTimeout(async () => {
                fireShutter();

                // Swap almost immediately while motion and flash hide the cut.
                imageCycleTimer = window.setTimeout(async () => {
                  await showNextImage();

                  window.setTimeout(() => {
                    cameraSection.classList.remove("capture-zoom");
                  }, 180);

                  // Shorter hold before repeating.
                  imageCycleTimer = window.setTimeout(runImageCycle, 2100);
                }, 90);
              }, 360);
            }, 260);
          }, 420);
        }, 1550);
      }


      let userCaptureBusy = false;

      function placeFocusPoint(clientX, clientY) {
        const rect = viewfinder.getBoundingClientRect();

        const x = clamp(clientX - rect.left, 22, rect.width - 22);
        const y = clamp(clientY - rect.top, 22, rect.height - 22);

        focusBox.style.left = `${x}px`;
        focusBox.style.top = `${y}px`;
      }

      function userShutterFlash() {
        shutterFlash.classList.remove("fire", "user-fire");
        cameraSection.classList.remove("user-trigger");

        void shutterFlash.offsetWidth;

        shutterFlash.classList.add("user-fire");
        cameraSection.classList.add("user-trigger");

        window.setTimeout(() => {
          shutterFlash.classList.remove("user-fire");
          cameraSection.classList.remove("user-trigger");
        }, 390);
      }

      function runUserCapture(clientX, clientY) {
        if (userCaptureBusy) return;
        userCaptureBusy = true;

        placeFocusPoint(clientX, clientY);

        focusBox.classList.remove("locked");
        focusBox.classList.add("searching");
        focusCurrentImage();

        window.setTimeout(() => {
          focusBox.classList.remove("searching");
          focusBox.classList.add("locked");

          window.setTimeout(() => {
            userShutterFlash();

            window.setTimeout(() => {
              focusBox.classList.remove("locked");
              userCaptureBusy = false;
            }, 620);
          }, 180);
        }, 330);
      }

      cameraSection.addEventListener("pointerup", event => {
        if (event.pointerType === "mouse" && event.button !== 0) return;
        runUserCapture(event.clientX, event.clientY);
      });

      function animate(now) {
        const delta = Math.min(.05, (now - lastTime) / 1000);
        lastTime = now;
        elapsed += delta;

        if (reducedMotion) {
          imageStage.style.transform =
            "translate3d(0,0,0) scale(1.1)";
          requestAnimationFrame(animate);
          return;
        }

        pointerX += (pointerTargetX - pointerX) * .055;
        pointerY += (pointerTargetY - pointerY) * .055;
        scrollProgress += (scrollTarget - scrollProgress) * .07;

        /*
          Scroll motion:
          0.00 to 0.50 moves image upward and zooms in.
          0.50 to 1.00 moves image downward and zooms back out.
        */
        const scrollWave =
          Math.sin(scrollProgress * Math.PI * 2 - Math.PI / 2);

        const scrollVertical =
          (scrollProgress - .5) * -120;

        const scrollHorizontal =
          Math.sin(scrollProgress * Math.PI * 1.65) * 48;

        const scrollZoom =
          1.12 + ((scrollWave + 1) / 2) * .14;

        /*
          Live viewfinder drift:
          Layered waves keep it moving without looking like
          a cheap repeating shake.
        */
        const liveX =
          Math.sin(elapsed * .53) * 10 +
          Math.sin(elapsed * 1.17 + 1.4) * 4;

        const liveY =
          Math.cos(elapsed * .46 + .6) * 8 +
          Math.sin(elapsed * 1.03) * 3;

        const liveZoom =
          Math.sin(elapsed * .46) * .026 +
          Math.sin(elapsed * 1.08 + .9) * .012;

        const targetX =
          scrollHorizontal +
          pointerX * -34 +
          liveX;

        const targetY =
          scrollVertical +
          pointerY * -24 +
          liveY;

        const targetScale =
          scrollZoom +
          liveZoom +
          Math.abs(pointerX) * .018 +
          Math.abs(pointerY) * .012;

        const targetRotate =
          pointerX * 1.5 +
          Math.sin(elapsed * .42) * .22;

        currentX += (targetX - currentX) * .065;
        currentY += (targetY - currentY) * .065;
        currentScale += (targetScale - currentScale) * .055;
        currentRotate += (targetRotate - currentRotate) * .05;

        imageStage.style.transform =
          `translate3d(${currentX}px, ${currentY}px, 0)
           rotateZ(${currentRotate}deg)
           scale(${currentScale})`;

        requestAnimationFrame(animate);
      }

      updateScrollProgress();
      runImageCycle();
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
