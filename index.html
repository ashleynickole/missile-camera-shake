<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#080808" />
  <title>Missile Studios Camera View</title>

  <style>
    :root {
      --frame-color: rgba(255, 255, 255, 0.92);
      --frame-muted: rgba(255, 255, 255, 0.56);
      --background: #080808;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--background);
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    .camera-scene {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 420px;
      overflow: hidden;
      background: #080808;
      perspective: 1200px;
      isolation: isolate;
      cursor: crosshair;
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
    }

    .camera-image-wrap {
      position: absolute;
      inset: -5%;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .camera-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center center;
      transform: scale(1.06);
      filter:
        contrast(1.04)
        saturate(0.96)
        brightness(0.98);
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .camera-image-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at center,
          transparent 42%,
          rgba(0,0,0,.08) 68%,
          rgba(0,0,0,.38) 100%
        ),
        linear-gradient(
          to bottom,
          rgba(0,0,0,.05),
          transparent 20%,
          transparent 78%,
          rgba(0,0,0,.12)
        );
      mix-blend-mode: multiply;
    }

    .glass {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background:
        linear-gradient(
          118deg,
          rgba(255,255,255,.07) 0%,
          rgba(255,255,255,0) 27%,
          rgba(255,255,255,0) 70%,
          rgba(255,255,255,.035) 100%
        );
    }

    .viewfinder {
      position: absolute;
      inset: clamp(18px, 3.2vw, 52px);
      z-index: 5;
      pointer-events: none;
    }

    .corner {
      position: absolute;
      width: clamp(36px, 5vw, 76px);
      height: clamp(36px, 5vw, 76px);
      opacity: .96;
    }

    .corner::before,
    .corner::after {
      content: "";
      position: absolute;
      background: var(--frame-color);
      border-radius: 999px;
      box-shadow: 0 0 8px rgba(0,0,0,.20);
    }

    .corner::before {
      width: 100%;
      height: 2px;
    }

    .corner::after {
      width: 2px;
      height: 100%;
    }

    .corner.top-left {
      top: 0;
      left: 0;
    }

    .corner.top-left::before,
    .corner.top-left::after {
      top: 0;
      left: 0;
    }

    .corner.top-right {
      top: 0;
      right: 0;
    }

    .corner.top-right::before {
      top: 0;
      right: 0;
    }

    .corner.top-right::after {
      top: 0;
      right: 0;
    }

    .corner.bottom-left {
      bottom: 0;
      left: 0;
    }

    .corner.bottom-left::before {
      bottom: 0;
      left: 0;
    }

    .corner.bottom-left::after {
      bottom: 0;
      left: 0;
    }

    .corner.bottom-right {
      bottom: 0;
      right: 0;
    }

    .corner.bottom-right::before {
      bottom: 0;
      right: 0;
    }

    .corner.bottom-right::after {
      bottom: 0;
      right: 0;
    }

    .focus-box {
      position: absolute;
      left: 50%;
      top: 50%;
      width: clamp(70px, 9vw, 132px);
      aspect-ratio: 1.38;
      transform: translate(-50%, -50%);
      opacity: .76;
    }

    .focus-corner {
      position: absolute;
      width: 19%;
      height: 25%;
    }

    .focus-corner::before,
    .focus-corner::after {
      content: "";
      position: absolute;
      background: var(--frame-color);
      border-radius: 999px;
      box-shadow: 0 0 6px rgba(0,0,0,.18);
    }

    .focus-corner::before {
      width: 100%;
      height: 1.5px;
    }

    .focus-corner::after {
      width: 1.5px;
      height: 100%;
    }

    .focus-corner.tl {
      top: 0;
      left: 0;
    }

    .focus-corner.tl::before,
    .focus-corner.tl::after {
      top: 0;
      left: 0;
    }

    .focus-corner.tr {
      top: 0;
      right: 0;
    }

    .focus-corner.tr::before {
      top: 0;
      right: 0;
    }

    .focus-corner.tr::after {
      top: 0;
      right: 0;
    }

    .focus-corner.bl {
      bottom: 0;
      left: 0;
    }

    .focus-corner.bl::before {
      bottom: 0;
      left: 0;
    }

    .focus-corner.bl::after {
      bottom: 0;
      left: 0;
    }

    .focus-corner.br {
      bottom: 0;
      right: 0;
    }

    .focus-corner.br::before {
      bottom: 0;
      right: 0;
    }

    .focus-corner.br::after {
      bottom: 0;
      right: 0;
    }

    .center-dot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--frame-color);
      transform: translate(-50%, -50%);
      box-shadow: 0 0 7px rgba(0,0,0,.34);
      opacity: .82;
    }

    .safe-line {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 42px;
      height: 1px;
      background: var(--frame-muted);
      opacity: .72;
    }

    .safe-line.top {
      top: 0;
    }

    .safe-line.bottom {
      bottom: 0;
    }

    .side-mark {
      position: absolute;
      top: 50%;
      width: 1px;
      height: 38px;
      background: var(--frame-muted);
      transform: translateY(-50%);
      opacity: .65;
    }

    .side-mark.left {
      left: 0;
    }

    .side-mark.right {
      right: 0;
    }

    .grain {
      position: absolute;
      inset: -50%;
      z-index: 6;
      opacity: .055;
      pointer-events: none;
      background-image:
        repeating-radial-gradient(
          circle at 17% 32%,
          rgba(255,255,255,.7) 0 0.5px,
          rgba(0,0,0,.55) 0.8px 1px,
          transparent 1.2px 4px
        );
      background-size: 6px 6px;
      animation: grainShift .22s steps(2) infinite;
      mix-blend-mode: overlay;
    }

    @keyframes grainShift {
      0%   { transform: translate3d(-2%, 1%, 0); }
      25%  { transform: translate3d(1%, -2%, 0); }
      50%  { transform: translate3d(2%, 2%, 0); }
      75%  { transform: translate3d(-1%, -1%, 0); }
      100% { transform: translate3d(1%, 1%, 0); }
    }

    .tap-hint {
      position: absolute;
      left: 50%;
      bottom: clamp(17px, 3vw, 34px);
      z-index: 7;
      transform: translateX(-50%);
      color: rgba(255,255,255,.66);
      font-size: 8px;
      font-weight: 700;
      letter-spacing: .22em;
      white-space: nowrap;
      text-shadow: 0 1px 10px rgba(0,0,0,.45);
      pointer-events: none;
      transition: opacity .5s ease;
    }

    .camera-scene.interacted .tap-hint {
      opacity: 0;
    }

    .flash {
      position: absolute;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      background: white;
      opacity: 0;
    }

    .flash.active {
      animation: flash .28s ease-out;
    }

    @keyframes flash {
      0% { opacity: 0; }
      18% { opacity: .58; }
      100% { opacity: 0; }
    }

    @media (max-width: 700px) {
      .camera-scene {
        min-height: 360px;
      }

      .viewfinder {
        inset: 16px;
      }

      .tap-hint {
        bottom: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .grain {
        animation: none;
      }

      .camera-image-wrap {
        transform: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="camera-scene" id="cameraScene" aria-label="Interactive cinematic portrait">
    <div class="camera-image-wrap" id="imageWrap">
      <img
        class="camera-image"
        src="https://static.wixstatic.com/media/566b6b_83e7b2d53f6a47f1999d518594826438~mv2.jpg"
        alt="Missile Studios client portrait"
        draggable="false"
      />
    </div>

    <div class="glass"></div>

    <div class="viewfinder" aria-hidden="true">
      <span class="corner top-left"></span>
      <span class="corner top-right"></span>
      <span class="corner bottom-left"></span>
      <span class="corner bottom-right"></span>

      <span class="safe-line top"></span>
      <span class="safe-line bottom"></span>
      <span class="side-mark left"></span>
      <span class="side-mark right"></span>

      <div class="focus-box">
        <span class="focus-corner tl"></span>
        <span class="focus-corner tr"></span>
        <span class="focus-corner bl"></span>
        <span class="focus-corner br"></span>
        <span class="center-dot"></span>
      </div>
    </div>

    <div class="grain"></div>
    <div class="tap-hint">MOVE · DRAG · TAP</div>
    <div class="flash" id="flash"></div>
  </main>

  <script>
    (() => {
      const scene = document.getElementById("cameraScene");
      const imageWrap = document.getElementById("imageWrap");
      const flash = document.getElementById("flash");

      let pointerX = 0;
      let pointerY = 0;
      let targetX = 0;
      let targetY = 0;
      let currentX = 0;
      let currentY = 0;
      let dragStartX = 0;
      let dragStartY = 0;
      let dragging = false;
      let pointerId = null;
      let elapsed = 0;
      let lastTime = performance.now();
      let impulse = 0;

      const reduceMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches;

      function normalizedPointer(clientX, clientY) {
        const rect = scene.getBoundingClientRect();

        return {
          x: ((clientX - rect.left) / rect.width - 0.5) * 2,
          y: ((clientY - rect.top) / rect.height - 0.5) * 2
        };
      }

      function updatePointer(clientX, clientY) {
        const normalized = normalizedPointer(clientX, clientY);

        pointerX = normalized.x;
        pointerY = normalized.y;

        targetX = pointerX;
        targetY = pointerY;

        scene.classList.add("interacted");
      }

      scene.addEventListener("pointermove", event => {
        if (dragging && event.pointerId === pointerId) {
          const rect = scene.getBoundingClientRect();

          targetX = Math.max(
            -1,
            Math.min(1, (event.clientX - dragStartX) / (rect.width * .28))
          );

          targetY = Math.max(
            -1,
            Math.min(1, (event.clientY - dragStartY) / (rect.height * .28))
          );
        } else {
          updatePointer(event.clientX, event.clientY);
        }
      });

      scene.addEventListener("pointerdown", event => {
        dragging = true;
        pointerId = event.pointerId;
        dragStartX = event.clientX;
        dragStartY = event.clientY;
        scene.setPointerCapture(pointerId);
        scene.classList.add("interacted");
      });

      scene.addEventListener("pointerup", event => {
        if (event.pointerId !== pointerId) return;

        dragging = false;

        try {
          scene.releasePointerCapture(pointerId);
        } catch (_) {}

        pointerId = null;
      });

      scene.addEventListener("pointercancel", () => {
        dragging = false;
        pointerId = null;
      });

      scene.addEventListener("pointerleave", () => {
        if (!dragging) {
          targetX = 0;
          targetY = 0;
        }
      });

      scene.addEventListener("click", () => {
        impulse = 1;

        flash.classList.remove("active");
        void flash.offsetWidth;
        flash.classList.add("active");
      });

      function animate(now) {
        const delta = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;
        elapsed += delta;

        if (reduceMotion) {
          imageWrap.style.transform =
            "translate3d(0,0,0) rotateX(0) rotateY(0) rotateZ(0) scale(1)";
          requestAnimationFrame(animate);
          return;
        }

        const follow = dragging ? 0.12 : 0.055;
        currentX += (targetX - currentX) * follow;
        currentY += (targetY - currentY) * follow;

        const breathX =
          Math.sin(elapsed * 0.92) * 1.5 +
          Math.sin(elapsed * 1.73 + 1.2) * 0.65;

        const breathY =
          Math.cos(elapsed * 0.76 + .4) * 1.25 +
          Math.sin(elapsed * 1.38) * 0.52;

        const roll =
          Math.sin(elapsed * 0.66 + .8) * 0.24 +
          Math.cos(elapsed * 1.12) * 0.10;

        const impulseX =
          Math.sin(elapsed * 44) * impulse * 7.5;

        const impulseY =
          Math.cos(elapsed * 37) * impulse * 5.5;

        const impulseRoll =
          Math.sin(elapsed * 31) * impulse * 0.75;

        impulse *= 0.88;

        const translateX =
          currentX * -14 +
          breathX +
          impulseX;

        const translateY =
          currentY * -10 +
          breathY +
          impulseY;

        const rotateY =
          currentX * 2.5 +
          Math.sin(elapsed * .55) * .18;

        const rotateX =
          currentY * -1.8 +
          Math.cos(elapsed * .48) * .14;

        const rotateZ =
          roll +
          impulseRoll;

        imageWrap.style.transform =
          `translate3d(${translateX}px, ${translateY}px, 0)
           rotateX(${rotateX}deg)
           rotateY(${rotateY}deg)
           rotateZ(${rotateZ}deg)
           scale(1.025)`;

        requestAnimationFrame(animate);
      }

      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
