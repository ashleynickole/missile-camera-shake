<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#080808" />
  <title>Missile Studios Live Viewfinder</title>

  <style>
    :root {
      --frame: rgba(255,255,255,.94);
      --frame-soft: rgba(255,255,255,.58);
      --bg: #080808;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    .viewfinder-scene {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 420px;
      overflow: hidden;
      background: #080808;
      isolation: isolate;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-y;
      cursor: crosshair;
    }

    .image-stage {
      position: absolute;
      inset: -10%;
      width: 120%;
      height: 120%;
      will-change: transform;
      transform: translate3d(0,0,0) scale(1.04);
    }

    .portrait {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center center;
      pointer-events: none;
      -webkit-user-drag: none;
      filter:
        contrast(1.025)
        saturate(.97)
        brightness(.985);
    }

    .image-stage::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at center,
          transparent 40%,
          rgba(0,0,0,.10) 70%,
          rgba(0,0,0,.44) 100%
        ),
        linear-gradient(
          to bottom,
          rgba(0,0,0,.08),
          transparent 18%,
          transparent 80%,
          rgba(0,0,0,.16)
        );
    }

    .glass {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background:
        linear-gradient(
          118deg,
          rgba(255,255,255,.075) 0%,
          transparent 26%,
          transparent 72%,
          rgba(255,255,255,.035) 100%
        );
    }

    .viewfinder-ui {
      position: absolute;
      inset: clamp(18px, 3.2vw, 52px);
      z-index: 5;
      pointer-events: none;
    }

    .corner {
      position: absolute;
      width: clamp(38px, 5vw, 78px);
      height: clamp(38px, 5vw, 78px);
    }

    .corner::before,
    .corner::after {
      content: "";
      position: absolute;
      background: var(--frame);
      border-radius: 999px;
      box-shadow: 0 1px 8px rgba(0,0,0,.25);
    }

    .corner::before {
      width: 100%;
      height: 2px;
    }

    .corner::after {
      width: 2px;
      height: 100%;
    }

    .tl { top: 0; left: 0; }
    .tr { top: 0; right: 0; }
    .bl { bottom: 0; left: 0; }
    .br { bottom: 0; right: 0; }

    .tl::before, .tl::after { top: 0; left: 0; }
    .tr::before { top: 0; right: 0; }
    .tr::after { top: 0; right: 0; }
    .bl::before { bottom: 0; left: 0; }
    .bl::after { bottom: 0; left: 0; }
    .br::before { bottom: 0; right: 0; }
    .br::after { bottom: 0; right: 0; }

    .focus-box {
      position: absolute;
      left: 50%;
      top: 50%;
      width: clamp(76px, 9.5vw, 136px);
      aspect-ratio: 1.4;
      transform: translate(-50%, -50%);
      opacity: .78;
    }

    .focus-piece {
      position: absolute;
      width: 19%;
      height: 27%;
    }

    .focus-piece::before,
    .focus-piece::after {
      content: "";
      position: absolute;
      background: var(--frame);
      border-radius: 999px;
      box-shadow: 0 1px 6px rgba(0,0,0,.25);
    }

    .focus-piece::before {
      width: 100%;
      height: 1.5px;
    }

    .focus-piece::after {
      width: 1.5px;
      height: 100%;
    }

    .focus-piece.tl::before,
    .focus-piece.tl::after { top: 0; left: 0; }

    .focus-piece.tr::before { top: 0; right: 0; }
    .focus-piece.tr::after { top: 0; right: 0; }

    .focus-piece.bl::before { bottom: 0; left: 0; }
    .focus-piece.bl::after { bottom: 0; left: 0; }

    .focus-piece.br::before { bottom: 0; right: 0; }
    .focus-piece.br::after { bottom: 0; right: 0; }

    .center-point {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--frame);
      transform: translate(-50%, -50%);
      box-shadow: 0 1px 7px rgba(0,0,0,.34);
    }

    .edge-mark {
      position: absolute;
      background: var(--frame-soft);
      opacity: .72;
    }

    .edge-mark.top,
    .edge-mark.bottom {
      left: 50%;
      width: 44px;
      height: 1px;
      transform: translateX(-50%);
    }

    .edge-mark.top { top: 0; }
    .edge-mark.bottom { bottom: 0; }

    .edge-mark.left,
    .edge-mark.right {
      top: 50%;
      width: 1px;
      height: 40px;
      transform: translateY(-50%);
    }

    .edge-mark.left { left: 0; }
    .edge-mark.right { right: 0; }

    .grain {
      position: absolute;
      inset: -40%;
      z-index: 6;
      opacity: .045;
      pointer-events: none;
      background-image:
        repeating-radial-gradient(
          circle at 21% 29%,
          rgba(255,255,255,.65) 0 .5px,
          rgba(0,0,0,.52) .8px 1px,
          transparent 1.2px 4px
        );
      background-size: 6px 6px;
      animation: grain 240ms steps(2) infinite;
      mix-blend-mode: overlay;
    }

    @keyframes grain {
      0%   { transform: translate3d(-1%, 1%, 0); }
      25%  { transform: translate3d(2%, -1%, 0); }
      50%  { transform: translate3d(1%, 2%, 0); }
      75%  { transform: translate3d(-2%, -1%, 0); }
      100% { transform: translate3d(1%, 1%, 0); }
    }

    .hint {
      position: absolute;
      left: 50%;
      bottom: clamp(16px, 2.6vw, 32px);
      z-index: 7;
      transform: translateX(-50%);
      color: rgba(255,255,255,.66);
      font-size: 8px;
      font-weight: 700;
      letter-spacing: .22em;
      white-space: nowrap;
      text-shadow: 0 1px 10px rgba(0,0,0,.5);
      pointer-events: none;
      transition: opacity .45s ease;
    }

    .viewfinder-scene.interacted .hint {
      opacity: 0;
    }

    @media (max-width: 700px) {
      .viewfinder-scene {
        min-height: 360px;
      }

      .viewfinder-ui {
        inset: 16px;
      }

      .image-stage {
        inset: -14%;
        width: 128%;
        height: 128%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .image-stage {
        transform: translate3d(0,0,0) scale(1.04) !important;
      }

      .grain {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main class="viewfinder-scene" id="scene" aria-label="Interactive live camera viewfinder">
    <div class="image-stage" id="imageStage">
      <img
        class="portrait"
        src="https://static.wixstatic.com/media/566b6b_83e7b2d53f6a47f1999d518594826438~mv2.jpg"
        alt="Missile Studios client portrait"
        draggable="false"
      />
    </div>

    <div class="glass"></div>

    <div class="viewfinder-ui" aria-hidden="true">
      <span class="corner tl"></span>
      <span class="corner tr"></span>
      <span class="corner bl"></span>
      <span class="corner br"></span>

      <span class="edge-mark top"></span>
      <span class="edge-mark bottom"></span>
      <span class="edge-mark left"></span>
      <span class="edge-mark right"></span>

      <div class="focus-box">
        <span class="focus-piece tl"></span>
        <span class="focus-piece tr"></span>
        <span class="focus-piece bl"></span>
        <span class="focus-piece br"></span>
        <span class="center-point"></span>
      </div>
    </div>

    <div class="grain"></div>
    <div class="hint">MOVE OR DRAG</div>
  </main>

  <script>
    (() => {
      const scene = document.getElementById("scene");
      const imageStage = document.getElementById("imageStage");

      let targetX = 0;
      let targetY = 0;
      let currentX = 0;
      let currentY = 0;

      let dragging = false;
      let pointerId = null;
      let dragOriginX = 0;
      let dragOriginY = 0;

      let elapsed = 0;
      let lastTime = performance.now();

      const reduceMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches;

      function normalize(clientX, clientY) {
        const rect = scene.getBoundingClientRect();

        return {
          x: ((clientX - rect.left) / rect.width - 0.5) * 2,
          y: ((clientY - rect.top) / rect.height - 0.5) * 2
        };
      }

      function setFromPointer(clientX, clientY) {
        const point = normalize(clientX, clientY);

        targetX = Math.max(-1, Math.min(1, point.x));
        targetY = Math.max(-1, Math.min(1, point.y));

        scene.classList.add("interacted");
      }

      scene.addEventListener("pointermove", event => {
        if (dragging && event.pointerId === pointerId) {
          const rect = scene.getBoundingClientRect();

          targetX = Math.max(
            -1,
            Math.min(
              1,
              (event.clientX - dragOriginX) / (rect.width * .24)
            )
          );

          targetY = Math.max(
            -1,
            Math.min(
              1,
              (event.clientY - dragOriginY) / (rect.height * .24)
            )
          );

          return;
        }

        setFromPointer(event.clientX, event.clientY);
      });

      scene.addEventListener("pointerdown", event => {
        dragging = true;
        pointerId = event.pointerId;
        dragOriginX = event.clientX;
        dragOriginY = event.clientY;

        scene.setPointerCapture(pointerId);
        scene.classList.add("interacted");
      });

      scene.addEventListener("pointerup", event => {
        if (event.pointerId !== pointerId) return;

        dragging = false;

        try {
          scene.releasePointerCapture(pointerId);
        } catch (_) {}

        pointerId = null;
      });

      scene.addEventListener("pointercancel", () => {
        dragging = false;
        pointerId = null;
      });

      scene.addEventListener("pointerleave", () => {
        if (!dragging) {
          targetX = 0;
          targetY = 0;
        }
      });

      function animate(now) {
        const delta = Math.min(.05, (now - lastTime) / 1000);
        lastTime = now;
        elapsed += delta;

        if (reduceMotion) {
          imageStage.style.transform =
            "translate3d(0,0,0) scale(1.04)";
          requestAnimationFrame(animate);
          return;
        }

        const easing = dragging ? .13 : .065;

        currentX += (targetX - currentX) * easing;
        currentY += (targetY - currentY) * easing;

        const liveDriftX =
          Math.sin(elapsed * .78) * 2.1 +
          Math.sin(elapsed * 1.64 + .9) * .85;

        const liveDriftY =
          Math.cos(elapsed * .69 + .4) * 1.7 +
          Math.sin(elapsed * 1.37) * .7;

        const parallaxX = currentX * -42;
        const parallaxY = currentY * -30;

        const subtleZoom =
          1.04 +
          Math.sin(elapsed * .52) * .004;

        imageStage.style.transform =
          `translate3d(
            ${parallaxX + liveDriftX}px,
            ${parallaxY + liveDriftY}px,
            0
          )
          scale(${subtleZoom})`;

        requestAnimationFrame(animate);
      }

      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
