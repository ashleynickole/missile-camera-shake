<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#080808" />
  <title>Missile Studios Live Viewfinder</title>

  <style>
    :root {
      --frame: rgba(255,255,255,.92);
      --frame-muted: rgba(255,255,255,.52);
      --bg: #080808;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      margin: 0;
      background: var(--bg);
    }

    body {
      min-height: 220vh;
      font-family: Arial, Helvetica, sans-serif;
    }

    .camera-section {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100svh;
      min-height: 480px;
      overflow: hidden;
      background: #080808;
      perspective: 1400px;
      isolation: isolate;
      cursor: crosshair;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-y;
    }

    .image-stage {
      position: absolute;
      inset: -12%;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .camera-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      transform: scale(1.08);
      filter:
        contrast(1.035)
        saturate(.97)
        brightness(.985);
      pointer-events: none;
      -webkit-user-drag: none;
    }

    .image-stage::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at center,
          transparent 38%,
          rgba(0,0,0,.07) 66%,
          rgba(0,0,0,.34) 100%
        ),
        linear-gradient(
          to bottom,
          rgba(0,0,0,.04),
          transparent 20%,
          transparent 80%,
          rgba(0,0,0,.11)
        );
    }

    .glass {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background:
        linear-gradient(
          118deg,
          rgba(255,255,255,.075) 0%,
          rgba(255,255,255,0) 29%,
          rgba(255,255,255,0) 72%,
          rgba(255,255,255,.035) 100%
        );
    }

    .viewfinder {
      position: absolute;
      inset: clamp(18px, 3vw, 50px);
      z-index: 5;
      pointer-events: none;
    }

    .corner {
      position: absolute;
      width: clamp(38px, 5vw, 78px);
      height: clamp(38px, 5vw, 78px);
    }

    .corner::before,
    .corner::after {
      content: "";
      position: absolute;
      background: var(--frame);
      border-radius: 999px;
      box-shadow: 0 0 8px rgba(0,0,0,.22);
    }

    .corner::before {
      width: 100%;
      height: 2px;
    }

    .corner::after {
      width: 2px;
      height: 100%;
    }

    .tl { top: 0; left: 0; }
    .tl::before, .tl::after { top: 0; left: 0; }

    .tr { top: 0; right: 0; }
    .tr::before { top: 0; right: 0; }
    .tr::after { top: 0; right: 0; }

    .bl { bottom: 0; left: 0; }
    .bl::before { bottom: 0; left: 0; }
    .bl::after { bottom: 0; left: 0; }

    .br { bottom: 0; right: 0; }
    .br::before { bottom: 0; right: 0; }
    .br::after { bottom: 0; right: 0; }

    .focus-box {
      position: absolute;
      left: 50%;
      top: 50%;
      width: clamp(76px, 9vw, 132px);
      aspect-ratio: 1.4;
      transform: translate(-50%, -50%);
      opacity: .74;
    }

    .focus-corner {
      position: absolute;
      width: 20%;
      height: 27%;
    }

    .focus-corner::before,
    .focus-corner::after {
      content: "";
      position: absolute;
      background: var(--frame);
      border-radius: 999px;
    }

    .focus-corner::before {
      width: 100%;
      height: 1.5px;
    }

    .focus-corner::after {
      width: 1.5px;
      height: 100%;
    }

    .focus-corner.tl::before,
    .focus-corner.tl::after { top: 0; left: 0; }

    .focus-corner.tr::before { top: 0; right: 0; }
    .focus-corner.tr::after { top: 0; right: 0; }

    .focus-corner.bl::before { bottom: 0; left: 0; }
    .focus-corner.bl::after { bottom: 0; left: 0; }

    .focus-corner.br::before { bottom: 0; right: 0; }
    .focus-corner.br::after { bottom: 0; right: 0; }

    .center-dot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--frame);
      transform: translate(-50%, -50%);
    }

    .safe-line {
      position: absolute;
      left: 50%;
      width: 42px;
      height: 1px;
      transform: translateX(-50%);
      background: var(--frame-muted);
    }

    .safe-line.top { top: 0; }
    .safe-line.bottom { bottom: 0; }

    .side-mark {
      position: absolute;
      top: 50%;
      width: 1px;
      height: 38px;
      transform: translateY(-50%);
      background: var(--frame-muted);
    }

    .side-mark.left { left: 0; }
    .side-mark.right { right: 0; }

    .grain {
      position: absolute;
      inset: -40%;
      z-index: 6;
      pointer-events: none;
      opacity: .045;
      background-image:
        repeating-radial-gradient(
          circle at 18% 31%,
          rgba(255,255,255,.7) 0 .45px,
          rgba(0,0,0,.6) .7px 1px,
          transparent 1.2px 4px
        );
      background-size: 6px 6px;
      animation: grain .24s steps(2) infinite;
      mix-blend-mode: overlay;
    }

    @keyframes grain {
      0% { transform: translate3d(-2%,1%,0); }
      25% { transform: translate3d(1%,-2%,0); }
      50% { transform: translate3d(2%,2%,0); }
      75% { transform: translate3d(-1%,-1%,0); }
      100% { transform: translate3d(1%,1%,0); }
    }

    .scroll-space {
      height: 120vh;
      background: #080808;
    }

    @media (max-width: 700px) {
      body {
        min-height: 185vh;
      }

      .camera-section {
        min-height: 420px;
      }

      .viewfinder {
        inset: 15px;
      }

      .image-stage {
        inset: -16%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body {
        min-height: 100vh;
      }

      .camera-section {
        position: relative;
      }

      .image-stage {
        transform: none !important;
      }

      .grain {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <section class="camera-section" id="cameraSection">
    <div class="image-stage" id="imageStage">
      <img
        class="camera-image"
        src="https://static.wixstatic.com/media/566b6b_83e7b2d53f6a47f1999d518594826438~mv2.jpg"
        alt="Missile Studios client portrait"
        draggable="false"
      />
    </div>

    <div class="glass"></div>

    <div class="viewfinder" aria-hidden="true">
      <span class="corner tl"></span>
      <span class="corner tr"></span>
      <span class="corner bl"></span>
      <span class="corner br"></span>

      <span class="safe-line top"></span>
      <span class="safe-line bottom"></span>
      <span class="side-mark left"></span>
      <span class="side-mark right"></span>

      <div class="focus-box">
        <span class="focus-corner tl"></span>
        <span class="focus-corner tr"></span>
        <span class="focus-corner bl"></span>
        <span class="focus-corner br"></span>
        <span class="center-dot"></span>
      </div>
    </div>

    <div class="grain"></div>
  </section>

  <div class="scroll-space" aria-hidden="true"></div>

  <script>
    (() => {
      const imageStage = document.getElementById("imageStage");
      const cameraSection = document.getElementById("cameraSection");

      let pointerTargetX = 0;
      let pointerTargetY = 0;
      let pointerX = 0;
      let pointerY = 0;

      let scrollTarget = 0;
      let scrollProgress = 0;

      let currentX = 0;
      let currentY = 0;
      let currentScale = 1.1;
      let currentRotate = 0;

      let lastTime = performance.now();
      let elapsed = 0;

      const reducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches;

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function updateScrollProgress() {
        const maxScroll =
          document.documentElement.scrollHeight -
          window.innerHeight;

        scrollTarget = maxScroll > 0
          ? clamp(window.scrollY / maxScroll, 0, 1)
          : 0;
      }

      function updatePointer(clientX, clientY) {
        const rect = cameraSection.getBoundingClientRect();

        pointerTargetX = clamp(
          ((clientX - rect.left) / rect.width - .5) * 2,
          -1,
          1
        );

        pointerTargetY = clamp(
          ((clientY - rect.top) / rect.height - .5) * 2,
          -1,
          1
        );
      }

      window.addEventListener("scroll", updateScrollProgress, {
        passive: true
      });

      window.addEventListener("resize", updateScrollProgress);

      cameraSection.addEventListener("pointermove", event => {
        updatePointer(event.clientX, event.clientY);
      });

      cameraSection.addEventListener("pointerleave", () => {
        pointerTargetX = 0;
        pointerTargetY = 0;
      });

      cameraSection.addEventListener("touchmove", event => {
        const touch = event.touches[0];

        if (touch) {
          updatePointer(touch.clientX, touch.clientY);
        }
      }, { passive: true });

      cameraSection.addEventListener("touchend", () => {
        pointerTargetX = 0;
        pointerTargetY = 0;
      }, { passive: true });

      function animate(now) {
        const delta = Math.min(.05, (now - lastTime) / 1000);
        lastTime = now;
        elapsed += delta;

        if (reducedMotion) {
          imageStage.style.transform =
            "translate3d(0,0,0) scale(1.1)";
          requestAnimationFrame(animate);
          return;
        }

        pointerX += (pointerTargetX - pointerX) * .055;
        pointerY += (pointerTargetY - pointerY) * .055;
        scrollProgress += (scrollTarget - scrollProgress) * .07;

        /*
          Scroll motion:
          0.00 to 0.50 moves image upward and zooms in.
          0.50 to 1.00 moves image downward and zooms back out.
        */
        const scrollWave =
          Math.sin(scrollProgress * Math.PI * 2 - Math.PI / 2);

        const scrollVertical =
          (scrollProgress - .5) * -120;

        const scrollHorizontal =
          Math.sin(scrollProgress * Math.PI * 1.65) * 48;

        const scrollZoom =
          1.12 + ((scrollWave + 1) / 2) * .14;

        /*
          Live viewfinder drift:
          Layered waves keep it moving without looking like
          a cheap repeating shake.
        */
        const liveX =
          Math.sin(elapsed * .53) * 10 +
          Math.sin(elapsed * 1.17 + 1.4) * 4;

        const liveY =
          Math.cos(elapsed * .46 + .6) * 8 +
          Math.sin(elapsed * 1.03) * 3;

        const liveZoom =
          Math.sin(elapsed * .36) * .018 +
          Math.sin(elapsed * .81 + .9) * .008;

        const targetX =
          scrollHorizontal +
          pointerX * -34 +
          liveX;

        const targetY =
          scrollVertical +
          pointerY * -24 +
          liveY;

        const targetScale =
          scrollZoom +
          liveZoom +
          Math.abs(pointerX) * .018 +
          Math.abs(pointerY) * .012;

        const targetRotate =
          pointerX * 1.5 +
          Math.sin(elapsed * .42) * .22;

        currentX += (targetX - currentX) * .065;
        currentY += (targetY - currentY) * .065;
        currentScale += (targetScale - currentScale) * .055;
        currentRotate += (targetRotate - currentRotate) * .05;

        imageStage.style.transform =
          `translate3d(${currentX}px, ${currentY}px, 0)
           rotateZ(${currentRotate}deg)
           scale(${currentScale})`;

        requestAnimationFrame(animate);
      }

      updateScrollProgress();
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
